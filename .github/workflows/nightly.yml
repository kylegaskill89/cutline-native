name: Nightly

# The whole tree in one job: the painting backend, the media layer, the
# compositor and the application that joins them. Push CI builds the pure half
# and the media half separately and never builds Skia at all, so this is the
# only place the real application is compiled.
#
# It is nightly rather than per-commit because FFmpeg and Skia are both long
# builds from source, and paying for them on every commit would slow the
# feedback that actually catches things to a crawl. A regression surfaces within
# a day rather than never, and `workflow_dispatch` is there for the times that
# is not soon enough.
on:
  schedule:
    # 05:00 UTC, which is the small hours wherever the work is happening.
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  full:
    name: Build and test everything (Windows)
    runs-on: windows-latest
    # FFmpeg and Skia from source together are comfortably over an hour on a
    # cold cache, and the default limit would cut it off partway and leave
    # nothing cached.
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      # Restore and save are split so the save runs even when a later step
      # fails. The combined action only saves on success, which would mean every
      # failing run threw away the Skia build and the next one started from
      # source again — the dependency is unrelated to whether our code compiled.
      - name: Restore vcpkg binaries
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-full-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-full-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}-
            vcpkg-full-${{ runner.os }}-

      - name: Point CMake at the preinstalled vcpkg
        run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      # Configure is what builds the dependencies, so the cache is saved
      # immediately afterwards rather than at the end of the job.
      # The ui preset does not set warnings-as-errors itself, because it is
      # also what local development builds; CI asks for it explicitly, the same
      # way the media job does.
      - name: Configure
        run: cmake --preset ui -DCUTLINE_WARNINGS_AS_ERRORS=ON

      # Always, not only on a miss. A fixed key saved only when the restore
      # missed can never grow past whatever the first saving run happened to
      # hold — see the note in `release.yml`, where that cost eighty minutes a
      # run for weeks while reporting a cache hit.
      - name: Save vcpkg binaries
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-full-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}

      - name: Build
        run: cmake --build --preset ui

      # The pixel tests render to a CPU raster surface and the compositor falls
      # back to WARP, so both run here without a GPU. The end-to-end tests that
      # need real footage skip, since it is not in the repository.
      - name: Test
        run: ctest --test-dir build/ui -C Release --output-on-failure

      # And the whole interface, laid out and painted in every theme with no
      # window at all. This is what would catch a control that demanded more
      # room than exists, or a theme that stopped reaching the pixels — neither
      # of which any unit test sees.
      - name: Paint every theme headlessly
        run: ./build/ui/tools/cutline/Release/cutline.exe --check

      # A build somebody can actually run, from whatever is on `main`.
      #
      # Releases are cut from tags and are therefore always behind: between one
      # and the next there was no way to try a fix without building the whole
      # tree, FFmpeg and Skia included, which is over an hour on a cold cache.
      # This is the same directory the installer packages — the executable, the
      # runtimes beside it and the compiled shaders — as a zip that runs where
      # it is unpacked. Unsigned and unversioned, because it is a *test* build
      # and dressing it as a release would invite it into places it should not
      # go.
      - name: Stage the application
        run: cmake --install build/ui --config Release --prefix staged

      - uses: actions/upload-artifact@v4
        with:
          name: cutline-main
          path: staged
          # A fortnight. Long enough to be useful for a build that is replaced
          # every night, short enough that the artifacts do not accumulate.
          retention-days: 14
