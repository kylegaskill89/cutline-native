name: Nightly

# The painting backend is the one part of the tree that push CI does not build.
# Skia is a long build from source, and paying for it on every commit would slow
# the feedback that actually catches things down to a crawl. Nightly is the
# compromise: a regression in the pixel tests or the window surfaces within a
# day rather than never, and `workflow_dispatch` is there for the times that is
# not soon enough.
on:
  schedule:
    # 05:00 UTC, which is the small hours wherever the work is happening.
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  skia:
    name: Build and test the painting backend (Windows)
    runs-on: windows-latest
    # Skia from source is comfortably over an hour on a cold cache, and the
    # default limit would cut it off partway and leave nothing cached.
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      # Restore and save are split so the save runs even when a later step
      # fails. The combined action only saves on success, which would mean every
      # failing run threw away the Skia build and the next one started from
      # source again — the dependency is unrelated to whether our code compiled.
      - name: Restore vcpkg binaries
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-skia-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-skia-${{ runner.os }}-

      - name: Point CMake at the preinstalled vcpkg
        run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      # Configure is what builds the dependencies, so the cache is saved
      # immediately afterwards rather than at the end of the job.
      - name: Configure
        run: cmake --preset skia

      - name: Save vcpkg binaries
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-skia-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Build
        run: cmake --build --preset skia

      # The pixel tests render to a CPU raster surface, so they need no GPU and
      # no window and run here exactly as they do locally.
      - name: Test
        run: ctest --preset skia

      # And the whole interface, laid out and painted in every theme with no
      # window at all. This is what would catch a control that demanded more
      # room than exists, or a theme that stopped reaching the pixels — neither
      # of which any unit test sees.
      - name: Paint every theme headlessly
        run: ./build/skia/tools/theme_window/Release/theme_window.exe --check
