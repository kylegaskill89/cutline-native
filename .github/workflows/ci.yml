name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and test (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Point CMake at the preinstalled vcpkg
        run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      # The runner image changes its Visual Studio version over time, and the
      # ci preset deliberately lets CMake auto-detect it. Log what was found so
      # a toolchain shift is diagnosable from the run alone.
      - name: Toolchain info
        run: |
          cmake --version
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            & $vswhere -latest -products * -format value -property displayName
            & $vswhere -latest -products * -format value -property installationVersion
          } else {
            "vswhere not present on this image"
          }

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        run: ctest --preset ci

  media:
    name: Build the media layer (Windows)
    runs-on: windows-latest
    # FFmpeg is a long build from source the first time. The vcpkg binary cache
    # makes every run after that quick, so this stays a separate job rather than
    # holding up feedback on the core.
    steps:
      - uses: actions/checkout@v4

      # Restore and save are split so the save can run even when a later step
      # fails. The combined action only saves on success, which meant that every
      # failing run threw away a half-hour FFmpeg build and the next run started
      # from source again — the dependencies are unrelated to whether our own
      # code compiled.
      - name: Restore vcpkg binaries
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-media-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-media-${{ runner.os }}-

      - name: Point CMake at the preinstalled vcpkg
        run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      # Configure is what builds the dependencies, so the cache is saved
      # immediately afterwards rather than at the end of the job.
      - name: Configure
        run: cmake --preset media -DCUTLINE_WARNINGS_AS_ERRORS=ON

      - name: Save vcpkg binaries
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-media-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Build
        run: cmake --build --preset media

      # The reference footage is not in the repository, so the tests that need
      # it skip here. What this job proves is that the media layer still
      # compiles and links, and that the footage-independent logic holds.
      - name: Test
        run: ctest --test-dir build/media -C Release --output-on-failure
